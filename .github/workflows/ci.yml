name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synvaro
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: synvaro_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U synvaro -d synvaro_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      WEB_ORIGIN: http://127.0.0.1:43100
      DATABASE_URL: postgresql://synvaro:ci-only-ephemeral@localhost:5432/synvaro_auth_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:validate
      - run: pnpm db:deploy
      - run: pnpm --filter @synvaro/database migrate:status
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
